version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pflegeos_db
    environment:
      POSTGRES_USER: pflegeos
      POSTGRES_PASSWORD: pflegeos_passwort
      POSTGRES_DB: pflegeos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: pflegeos_app
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    restart: unless-stopped
    command: flask run --host=0.0.0.0 --port=5000

volumes:
  postgres_data:
