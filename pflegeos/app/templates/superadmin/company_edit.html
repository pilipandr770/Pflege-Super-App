{% extends "base.html" %}
{% block title %}{{ c.name }} bearbeiten — Superadmin{% endblock %}

{% block content %}
<div class="mb-4">
  <nav aria-label="breadcrumb" class="mb-1">
    <ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="{{ url_for('superadmin.index') }}">⚡ Superadmin</a></li>
      <li class="breadcrumb-item"><a href="{{ url_for('superadmin.company_detail', company_id=c.id) }}">{{ c.name }}</a></li>
      <li class="breadcrumb-item active">Bearbeiten</li>
    </ol>
  </nav>
  <h4 class="fw-bold mb-0">Einrichtung bearbeiten</h4>
</div>

<div class="card" style="max-width:600px">
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Name der Einrichtung</label>
        <input type="text" name="name" value="{{ c.name }}" class="form-control" required>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            {% for s in ['PENDING','VERIFIED','ACTIVE','SUSPENDED','CANCELLED','TRIAL'] %}
            <option value="{{ s }}" {{ 'selected' if c.status == s }}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Plan</label>
          <select name="plan" class="form-select">
            {% for p in ['TRIAL','STARTER','PRO','PREMIUM'] %}
            <option value="{{ p }}" {{ 'selected' if c.plan == p }}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Trial endet am</label>
        <input type="date" name="trial_ends_at" class="form-control"
               value="{{ c.trial_ends_at.strftime('%Y-%m-%d') if c.trial_ends_at else '' }}">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Speichern</button>
        <a href="{{ url_for('superadmin.company_detail', company_id=c.id) }}" class="btn btn-outline-secondary">Abbrechen</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
