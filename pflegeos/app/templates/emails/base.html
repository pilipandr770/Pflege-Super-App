<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; border: 1px solid #ddd; }
        .header { background-color: #1a5f7a; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .footer { background-color: #f5f5f5; padding: 15px; text-align: center; font-size: 12px; color: #666; }
        .button { background-color: #1a5f7a; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .alert { padding: 15px; margin: 10px 0; border-left: 4px solid #dc3545; background-color: #f8d7da; }
        .info { padding: 15px; margin: 10px 0; border-left: 4px solid #0d6efd; background-color: #cfe2ff; }
        h2 { color: #1a5f7a; border-bottom: 2px solid #1a5f7a; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PflegeOS</h1>
            <p>Pflegeinrichtungs-Management System</p>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>© 2026 PflegeOS. Alle Rechte vorbehalten.</p>
            <p>Dies ist eine automatisierte Nachricht. Bitte antworten Sie nicht auf diese E-Mail.</p>
        </div>
    </div>
</body>
</html>
