{# Onboarding Progress Bar — inkludiert in allen Schritten #}
<div class="mb-5">
  <div class="d-flex justify-content-between align-items-start position-relative" style="gap:0">
    {% for s in steps %}
    {% set active   = (s.nr == step.nr) %}
    {% set done     = (s.nr < step.nr) %}
    <div class="text-center flex-fill">
      <div class="d-flex align-items-center">
        {% if not loop.first %}
        <div class="flex-fill border-top border-2 mt-n3"
             style="border-color: {{ '#1a5f7a' if done else '#dee2e6' }} !important"></div>
        {% endif %}
        <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold"
             style="width:36px;height:36px;flex-shrink:0;
                    background:{{ '#1a5f7a' if (active or done) else '#dee2e6' }};
                    color:{{ 'white' if (active or done) else '#6c757d' }}">
          {% if done %}<i class="bi bi-check-lg"></i>{% else %}{{ s.nr }}{% endif %}
        </div>
        {% if not loop.last %}
        <div class="flex-fill border-top border-2 mt-n3"
             style="border-color: {{ '#1a5f7a' if done else '#dee2e6' }} !important"></div>
        {% endif %}
      </div>
      <div class="small mt-2 {{ 'fw-semibold text-primary' if active else ('text-muted' if not done else 'text-success') }}">
        {{ s.title }}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
