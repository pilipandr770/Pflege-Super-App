<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden — PflegeOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f7f8; }
    .login-card { max-width: 420px; }
    .brand-icon { font-size: 2.5rem; color: #1a5f7a; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<div class="login-card w-100 px-3">
  <div class="text-center mb-4">
    <div class="brand-icon">&#x1F493;</div>
    <h1 class="h3 fw-bold text-dark">PflegeOS</h1>
    <p class="text-muted small">Pflege-Dokumentation & Compliance</p>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h5 class="card-title mb-4">Anmelden</h5>
      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">E-Mail</label>
          <input type="email" name="email" class="form-control" autocomplete="email"
                 required autofocus placeholder="ihre@email.de">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Passwort</label>
          <input type="password" name="password" class="form-control"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">
          Anmelden
        </button>
      </form>
    </div>
  </div>
  <div class="text-center mt-3">
    <small class="text-muted">Noch kein Konto?
      <a href="{{ url_for('auth.register') }}">Einrichtung registrieren</a>
    </small>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
