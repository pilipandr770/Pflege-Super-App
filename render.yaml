# ============================================================
# PflegeOS — Render.com Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: pflegeos
    runtime: docker
    rootDir: pflegeos          # Dockerfile liegt in pflegeos/
    plan: starter              # $7/mo — always on, required for Docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /auth/login
    envVars:
      # ── Flask ──────────────────────────────────────────────
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true

      # ── Datenbank (automatisch verknüpft) ──────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: pflegeos-db
          property: connectionString

      # ── Sicherheit ─────────────────────────────────────────
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: ENCRYPTION_KEY
        sync: false           # ⚠ Im Dashboard manuell eintragen!

      # ── Uploads ────────────────────────────────────────────
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "16777216"

      # ── System-URL (nach erstem Deploy anpassen) ───────────
      - key: SYSTEM_URL
        value: https://pflegeos.onrender.com

      # ── E-Mail ─────────────────────────────────────────────
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "1"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # ── Anthropic API ──────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Stripe ─────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PLAN_AMOUNT
        value: "25000"
      - key: STRIPE_PLAN_CURRENCY
        value: eur
      - key: STRIPE_PLAN_NAME
        value: PflegeOS Professional

databases:
  - name: pflegeos-db
    plan: free                 # PostgreSQL free: 1 GB, 90 Tage aktiv
    databaseName: pflegeos_db
    user: pflegeos
